name: Deploy client

# Server deploys are handled by Render (render.yaml) after CI passes.
on:
  push:
    branches: [main]
    paths:
      - client/**
      - packages/rules/**
      - package-lock.json
      - .github/workflows/deploy-client.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test -w @labyrinth/rules -w @labyrinth/client
      - run: npm run build -w @labyrinth/client
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_SERVER_URL: ${{ vars.VITE_SERVER_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
