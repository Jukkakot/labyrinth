schema: spec-driven

context: |
  Labyrinth: web multiplayer clone of Ravensburger "Das verrückte Labyrinth"
  (fi: Muuttuva labyrintti), original rules, humans and bots, mobile first.

  Monorepo (npm workspaces, TypeScript):
  - packages/rules: pure deterministic game logic (seeded randomness), shared
    by server and client. No React, Colyseus or I/O.
  - server: Colyseus on Node 22. Authoritative: invalid commands are rejected
    with an error code and never change state. In-memory rooms only.
  - client: React + Vite, mobile portrait first. Server state is the truth.

  Always: English identifiers and names; UI text Finnish first + English via
  i18next; prefer established libraries over hand-written plumbing; minimalist
  UI; tap targets ≥44 px; budget 0 €.

  Read the relevant files before writing artifacts (an existing spec in
  openspec/specs wins over these):
  - openspec/context/product.md: game rules, modes, lobby, UX decisions
    → proposals and specs for any gameplay, lobby or UI change
  - openspec/context/architecture.md: board coordinates, phases, commands,
    bots, hidden information → any design touching game state or commands
  - openspec/context/nfr.md: logging/audit, testing, abuse protection,
    versioning, hosting limits → every design and task list
  - openspec/context/roadmap.md: planned change order → when choosing or
    scoping the next change

rules:
  proposal:
    - State which workspaces (rules, server, client) the change touches.
  specs:
    - Specs describe game rules and observable behavior, never library or class names.
  design:
    - Explain how the change meets openspec/context/nfr.md (logging, tests, limits).
  tasks:
    - Each task group lands its own tests (rules unit, server integration, E2E where a critical path changes).
    - Rule logic goes to packages/rules before server or client wiring.
