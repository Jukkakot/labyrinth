schema: spec-driven

context: |
  Product: "Labyrinth" – a web multiplayer clone of the board game
  Ravensburger "Das verrückte Labyrinth" (Finnish: Muuttuva labyrintti).
  Players shift a row/column of the 7x7 board with the spare tile, then move
  their pawn along connected paths to collect treasures. Future: computer
  (bot) players can play alongside humans.

  Architecture (npm workspaces monorepo, TypeScript everywhere):
  - packages/rules  (@labyrinth/rules): pure, deterministic game logic shared by
    server and client. No dependencies on React, Colyseus or I/O. All
    randomness comes from an injected seed so games and bugs are reproducible.
  - server (@labyrinth/server): Colyseus 0.18 on Node 22. Authoritative: every
    command is validated against the current phase and state and rejected with
    a clear error code when invalid; the client is never trusted. One Room per
    game, many concurrent games. Game state is in memory only (lost on
    restart/deploy); persistence is out of scope until explicitly added. Bots
    must go through the same command validation as human players.
  - client (@labyrinth/client): React 19 + Vite, mobile-first web UI (mobile
    portrait is the primary target, desktop must also work). Uses
    @labyrinth/rules for previews/highlights, but the server state is the
    source of truth.

  Conventions:
  - All code, identifiers, file and package names are in English.
  - UI text is Finnish first with English as the alternative; every
    user-visible string goes through i18next (client/src/i18n/locales).
  - Prefer established third-party libraries over hand-written plumbing; only
    game rules are our own code.
  - Tests: Vitest in every workspace. Spec scenarios map to tests in
    packages/rules; server rooms are tested with @colyseus/testing.
  - Interactive elements are at least 44x44 px.
  - Hosting: client on GitHub Pages, server on Render; both deploy on push to
    main via CI.

rules:
  proposal:
    - State which workspaces (rules, server, client) the change touches.
  specs:
    - Specs describe game rules and observable behavior, never library or class names.
  tasks:
    - Each task group lands its own Vitest tests.
    - Rule logic goes to packages/rules before server or client wiring.
